<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1320" viewBox="0 0 1800 1320" role="img" aria-labelledby="title description">
  <title id="title">KajoRecSys system flow</title>
  <desc id="description">Account registration and email verification lead to a role-specific dashboard, followed by student, teacher, and Guidance Office workflows.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#64748b"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#15803d"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#7c3aed"/>
    </marker>
    <style>
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #172033; }
      .title { font-size: 38px; font-weight: 750; letter-spacing: -0.5px; }
      .subtitle { font-size: 17px; fill: #526174; }
      .section { font-size: 13px; font-weight: 700; letter-spacing: 1.5px; fill: #64748b; }
      .node-title { font-size: 17px; font-weight: 700; }
      .node-copy { font-size: 14px; fill: #526174; }
      .lane-title { font-size: 21px; font-weight: 750; }
      .lane-kicker { font-size: 12px; font-weight: 700; letter-spacing: 1.2px; }
      .lane-heading { font-size: 15px; font-weight: 700; }
      .lane-copy { font-size: 14px; fill: #425166; }
      .arrow-label { font-size: 12px; font-weight: 650; fill: #526174; }
      .footer { font-size: 13px; fill: #64748b; }
    </style>
  </defs>

  <rect width="1800" height="1320" fill="#f5f7fb"/>
  <rect x="0" y="0" width="1800" height="10" fill="#16a34a"/>
  <text x="72" y="76" class="title">KajoRecSys System Flow</text>
  <text x="72" y="108" class="subtitle">Account access, email verification, and role-based workflows</text>

  <text x="72" y="158" class="section">ACCOUNT ACCESS</text>

  <g fill="#ffffff" stroke="#d7dee8" stroke-width="1.5">
    <rect x="72" y="184" width="245" height="94" rx="16"/>
    <rect x="378" y="184" width="290" height="94" rx="16"/>
    <rect x="728" y="184" width="272" height="94" rx="16"/>
    <rect x="1060" y="184" width="296" height="94" rx="16"/>
    <rect x="1416" y="184" width="312" height="94" rx="16"/>
  </g>
  <g fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M317 231H368"/>
    <path d="M668 231H718"/>
    <path d="M1000 231H1050"/>
    <path d="M1356 231H1406"/>
  </g>
  <text x="194" y="221" text-anchor="middle" class="node-title">Register or sign in</text>
  <text x="194" y="247" text-anchor="middle" class="node-copy">Start an account session</text>
  <text x="523" y="218" text-anchor="middle" class="node-title">Account checks</text>
  <text x="523" y="244" text-anchor="middle" class="node-copy">Email verified + account active?</text>
  <text x="864" y="218" text-anchor="middle" class="node-title">Email verification</text>
  <text x="864" y="244" text-anchor="middle" class="node-copy">Enter the 6-digit email OTP</text>
  <text x="1208" y="218" text-anchor="middle" class="node-title">Verified registration</text>
  <text x="1208" y="244" text-anchor="middle" class="node-copy">Auto sign-in + session logging</text>
  <text x="1572" y="218" text-anchor="middle" class="node-title">Role-based dashboard</text>
  <text x="1572" y="244" text-anchor="middle" class="node-copy">Optional 2FA on sign-in</text>

  <path d="M523 278V324H864V288" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="540" y="315" class="arrow-label" fill="#b45309">New or unverified account</text>
  <path d="M864 278V329H741" fill="none" stroke="#dc2626" stroke-width="2"/>
  <rect x="506" y="329" width="235" height="58" rx="12" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
  <text x="623" y="353" text-anchor="middle" class="node-heading node-title" fill="#9a3412">Invalid / expired code?</text>
  <text x="623" y="374" text-anchor="middle" class="node-copy">Retry or request a new code</text>
  <path d="M741 358H775V278" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <path d="M668 204V168H1208V174" fill="none" stroke="#15803d" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-green)"/>
  <text x="910" y="164" text-anchor="middle" class="arrow-label" fill="#15803d">Already verified and active</text>

  <text x="72" y="442" class="section">ROLE WORKFLOWS</text>

  <g>
    <rect x="72" y="468" width="526" height="742" rx="20" fill="#ffffff" stroke="#b7e4c7" stroke-width="1.5"/>
    <path d="M92 468H578Q598 468 598 488V548H72V488Q72 468 92 468Z" fill="#eaf8ef"/>
    <circle cx="110" cy="507" r="13" fill="#16a34a"/>
    <text x="136" y="503" class="lane-kicker" fill="#15803d">ROLE 01</text>
    <text x="136" y="528" class="lane-title">Student</text>

    <rect x="112" y="576" width="446" height="70" rx="13" fill="#f7fcf8" stroke="#d6eee0"/>
    <text x="132" y="604" class="lane-heading">Student dashboard</text>
    <text x="132" y="627" class="lane-copy">View assignments, requests, and activity</text>
    <path d="M335 646V674" stroke="#15803d" stroke-width="2" marker-end="url(#arrow-green)"/>
    <rect x="112" y="680" width="446" height="94" rx="13" fill="#ffffff" stroke="#d6eee0"/>
    <text x="132" y="708" class="lane-heading">Choose a workflow</text>
    <text x="132" y="734" class="lane-copy">Complete a Client Information Form (if pending)</text>
    <text x="132" y="755" class="lane-copy">Then request a form, complete an assignment, or</text>
    <text x="132" y="773" class="lane-copy">request a counseling appointment</text>
    <path d="M335 774V802" stroke="#15803d" stroke-width="2" marker-end="url(#arrow-green)"/>
    <rect x="112" y="808" width="446" height="124" rx="13" fill="#f7fcf8" stroke="#d6eee0"/>
    <text x="132" y="837" class="lane-heading">Forms and assignments</text>
    <text x="132" y="863" class="lane-copy">Submit completed forms to Guidance for review</text>
    <text x="132" y="886" class="lane-copy">For a Class Admission Slip, attach evidence and</text>
    <text x="132" y="909" class="lane-copy">send it to Guidance for a decision</text>
    <path d="M335 932V960" stroke="#15803d" stroke-width="2" marker-end="url(#arrow-green)"/>
    <rect x="112" y="966" width="446" height="100" rx="13" fill="#f7fcf8" stroke="#d6eee0"/>
    <text x="132" y="995" class="lane-heading">Follow up</text>
    <text x="132" y="1021" class="lane-copy">Review corrections, appointment status, and</text>
    <text x="132" y="1044" class="lane-copy">completed form or admission-slip results</text>
    <rect x="112" y="1090" width="446" height="78" rx="13" fill="#ecfdf3" stroke="#bbf7d0"/>
    <text x="132" y="1120" class="lane-heading" fill="#166534">Appointment requests</text>
    <text x="132" y="1145" class="lane-copy">Guidance schedules or declines with a reason</text>
  </g>

  <g>
    <rect x="637" y="468" width="526" height="742" rx="20" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
    <path d="M657 468H1143Q1163 468 1163 488V548H637V488Q637 468 657 468Z" fill="#eff6ff"/>
    <circle cx="675" cy="507" r="13" fill="#3b82f6"/>
    <text x="701" y="503" class="lane-kicker" fill="#2563eb">ROLE 02</text>
    <text x="701" y="528" class="lane-title">Teacher</text>

    <rect x="677" y="576" width="446" height="70" rx="13" fill="#f8fbff" stroke="#dbeafe"/>
    <text x="697" y="604" class="lane-heading">Teacher dashboard</text>
    <text x="697" y="627" class="lane-copy">View students, referrals, and follow-ups</text>
    <path d="M900 646V674" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <rect x="677" y="680" width="446" height="100" rx="13" fill="#ffffff" stroke="#dbeafe"/>
    <text x="697" y="709" class="lane-heading">Select a student</text>
    <text x="697" y="735" class="lane-copy">Assign a form or create a student referral</text>
    <text x="697" y="758" class="lane-copy">Student receives the assignment for completion</text>
    <path d="M900 780V808" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <rect x="677" y="814" width="446" height="98" rx="13" fill="#f8fbff" stroke="#dbeafe"/>
    <text x="697" y="843" class="lane-heading">Track referrals</text>
    <text x="697" y="869" class="lane-copy">Monitor referral status and follow-up activity</text>
    <text x="697" y="892" class="lane-copy">Guidance reviews and acts on referred students</text>
    <path d="M900 912V940" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <rect x="677" y="946" width="446" height="108" rx="13" fill="#f8fbff" stroke="#dbeafe"/>
    <text x="697" y="975" class="lane-heading">View Class Admission result</text>
    <text x="697" y="1001" class="lane-copy">After Guidance finalizes the decision, the</text>
    <text x="697" y="1024" class="lane-copy">student can forward the result to the teacher</text>
    <rect x="677" y="1090" width="446" height="78" rx="13" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="697" y="1120" class="lane-heading" fill="#1d4ed8">Role-restricted access</text>
    <text x="697" y="1145" class="lane-copy">Teacher pages require an authenticated teacher</text>
  </g>

  <g>
    <rect x="1202" y="468" width="526" height="742" rx="20" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.5"/>
    <path d="M1222 468H1708Q1728 468 1728 488V548H1202V488Q1202 468 1222 468Z" fill="#f5f3ff"/>
    <circle cx="1240" cy="507" r="13" fill="#8b5cf6"/>
    <text x="1266" y="503" class="lane-kicker" fill="#7c3aed">ROLE 03</text>
    <text x="1266" y="528" class="lane-title">Guidance Office</text>

    <rect x="1242" y="576" width="446" height="70" rx="13" fill="#faf9ff" stroke="#e9ddff"/>
    <text x="1262" y="604" class="lane-heading">Guidance dashboard</text>
    <text x="1262" y="627" class="lane-copy">Review forms, referrals, and appointment requests</text>
    <path d="M1465 646V674" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-purple)"/>
    <rect x="1242" y="680" width="446" height="122" rx="13" fill="#ffffff" stroke="#e9ddff"/>
    <text x="1262" y="709" class="lane-heading">Review submitted forms</text>
    <text x="1262" y="735" class="lane-copy">Approve and save, or return for correction</text>
    <text x="1262" y="758" class="lane-copy">Approved work appears in the student's history</text>
    <text x="1262" y="781" class="lane-copy">Returned work goes back to the student</text>
    <path d="M1465 802V830" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-purple)"/>
    <rect x="1242" y="836" width="446" height="124" rx="13" fill="#faf9ff" stroke="#e9ddff"/>
    <text x="1262" y="865" class="lane-heading">Review referrals</text>
    <text x="1262" y="891" class="lane-copy">Schedule counseling or issue a Class Admission Slip</text>
    <text x="1262" y="914" class="lane-copy">Review the completed slip and excuse evidence</text>
    <text x="1262" y="937" class="lane-copy">Accept or reject the excuse; finalize the result</text>
    <path d="M1465 960V988" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-purple)"/>
    <rect x="1242" y="994" width="446" height="92" rx="13" fill="#faf9ff" stroke="#e9ddff"/>
    <text x="1262" y="1023" class="lane-heading">Manage appointments</text>
    <text x="1262" y="1049" class="lane-copy">Accept and schedule, or decline with a reason</text>
    <text x="1262" y="1072" class="lane-copy">Student sees the updated appointment status</text>
    <rect x="1242" y="1102" width="446" height="66" rx="13" fill="#f5f3ff" stroke="#ddd6fe"/>
    <text x="1262" y="1130" class="lane-heading" fill="#6d28d9">Counselor actions</text>
    <text x="1262" y="1153" class="lane-copy">Restricted to the Guidance counselor role</text>
  </g>

  <g fill="none" stroke-width="2.5">
    <path d="M1572 278V408H335V458" stroke="#15803d" marker-end="url(#arrow-green)"/>
    <path d="M1572 408H900V458" stroke="#2563eb" marker-end="url(#arrow-blue)"/>
    <path d="M1572 408H1465V458" stroke="#7c3aed" marker-end="url(#arrow-purple)"/>
    <path d="M558 867H622V742H667" stroke="#15803d" stroke-dasharray="7 5" marker-end="url(#arrow-blue)"/>
    <path d="M1123 735H1187V741H1232" stroke="#2563eb" stroke-dasharray="7 5" marker-end="url(#arrow-purple)"/>
    <path d="M1202 751H1188V1222H65V900H102" stroke="#7c3aed" stroke-dasharray="7 5" marker-end="url(#arrow-green)"/>
    <path d="M1688 914H1710V1000H1133" stroke="#7c3aed" stroke-dasharray="7 5" marker-end="url(#arrow-blue)"/>
  </g>
  <rect x="72" y="1242" width="16" height="4" rx="2" fill="#64748b"/>
  <text x="98" y="1249" class="footer">Solid arrows show the main flow. Dashed arrows show handoffs between roles. Access to dashboards and actions is role-restricted.</text>
</svg>
